name: Sync USC pool hours

on:
  schedule:
    # GitHub cron 用 UTC，且高峰期会延迟 5-30 分钟，所以一天跑三次而不是掐点跑一次
    - cron: "0 14 * * *"   # 07:00 PT
    - cron: "0 20 * * *"   # 13:00 PT
    - cron: "0 3 * * *"    # 20:00 PT
  workflow_dispatch:
    inputs:
      force:
        description: "忽略变更检测，强制同步"
        type: boolean
        default: false

concurrency:
  group: pool-sync
  cancel-in-progress: false

permissions:
  contents: write        # 只为了回写 state.json

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Sync
        env:
          DEEPSEEK_API_KEY:       ${{ secrets.DEEPSEEK_API_KEY }}
          GCP_SA_JSON:            ${{ secrets.GCP_SA_JSON }}
          GCAL_CALENDAR_ID:       ${{ secrets.GCAL_CALENDAR_ID }}
          GCAL_BUSY_CALENDAR_ID:  ${{ secrets.GCAL_BUSY_CALENDAR_ID }}
          DISCORD_WEBHOOK:        ${{ secrets.DISCORD_WEBHOOK }}
        run: python -m src.main ${{ inputs.force && '--force' || '' }}

      # 回写 state.json 同时也是"心跳"——仓库 60 天无活动 GitHub 会禁用 schedule
      - name: Commit state
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name  "usc-pool-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "chore: update pool hours state [skip ci]"
            git push
          else
            echo "state.json 无变化"
          fi
